const DATA = [{"id": 0, "story": "sanctions", "country": "United States", "outlet": "NPR", "title": "Zelenskyy urges support for new US sanctions on Russia after Trump puts them on hold", "subtitle": "", "byline": "The Associated Press", "date": "October 17, 2026, 10:25 AM ET", "link": "https://www.npr.org/2026/10/17/nx-s1-6006745/us-sanctions-russia", "words": 773, "paras": [{"t": "p", "x": "KYIV, Ukraine — Ukrainian President Volodymyr Zelenskyy urged supporters Saturday to speak out in defense of new U.S. sanctions against Russia, hours after President Donald Trump signed an executive order pausing a sweeping package of restrictions targeting the Russian economy."}, {"t": "p", "x": "The White House decision has further raised fears that Ukraine could be left exposed to Moscow's escalating assaults with winter approaching."}, {"t": "p", "x": "Russian attacks overnight killed at least four people, including an ambulance driver, and wounded dozens, officials said. Ukrainian drones killed a woman in a Russian border region and disrupted flights at Moscow's airports, according to Russian authorities."}, {"t": "p", "x": "In a statement on social media, Zelenskyy described Trump's move to put sanctions on hold as unfortunate, but did not directly criticize the U.S. leader despite deepening tensions between Ukraine and Washington in recent days."}, {"t": "p", "x": "\"A decision was unfortunately made in America to completely disregard the Lindsey Graham Act, which was supposed to impose truly effective pressure on Russia to bring this war to an end,\" Zelenskyy wrote."}, {"t": "p", "x": "Later, in audio clips answering journalists' questions, Zelenskyy thanked Democrats and Republicans who backed the legislation and praised its bipartisan support. He said blocking it would encourage Russia to continue killing and do nothing to bring the war to an end."}, {"t": "p", "x": "He also added that limiting Ukraine's ability to retaliate against Russian attacks would not bring peace."}, {"t": "p", "x": "\"Nevertheless, we very much hope — and I personally hope — that the president of the United States of America will do everything possible to make Putin stop the killing, stop the attacks on our energy infrastructure, and end this war,\" he said."}, {"t": "h", "x": "Critics say Trump's decision helps Putin"}, {"t": "p", "x": "Named after late South Carolina Sen. Lindsey Graham, the legislation had sought to clamp down more quickly on the flow of financial resources fueling Russia's 4 1/2-year-old war against Ukraine. The bill had sought to sanction Russian officials, banks and a shadow fleet of tankers that keeps Russian energy moving."}, {"t": "p", "x": "Trump personally signed the legislation just last month and his move came just two days before a deadline set in the law itself for its implementation."}, {"t": "p", "x": "The president told Congress that the pause was in the national interest but gave no further details."}, {"t": "p", "x": "Sen. Richard Blumenthal, who co-drafted the bill, said in a statement that Trump was turning his back on \"the majority of Americans, their representatives in both houses of Congress, and our European allies.\""}, {"t": "p", "x": "\"These waivers have nothing to do with our national security, and everything to do with sucking up to Vladimir Putin,\" Blumenthal said."}, {"t": "p", "x": "Trump's unexpected decision comes a week after he stunningly said the U.S. had agreed to purchase diesel from Russia to try to bring down global energy prices, despite that potentially hurting Ukraine in its war with Russia."}, {"t": "p", "x": "Trump said Russia would immediately supply more than 300,000 tons of diesel, followed by an additional 500,000 tons in November and 1 million tons \"immediately thereafter.\""}, {"t": "h", "x": "Kyiv says Moscow carried out a 'massive' energy strike"}, {"t": "p", "x": "Zelenskyy also said Saturday that Moscow had carried out a massive strike on Ukraine's energy infrastructure, targeting more than 15 sites across the country."}, {"t": "p", "x": "\"The sheer scale and unrelenting pace of Russia's strikes, specifically against our energy sector, are unfortunately having severe consequences,\" he said."}, {"t": "p", "x": "Ukraine's air force said that Russian forces launched four cruise missiles and 332 attack drones overnight. All of the missiles and 289 of the drones had been suppressed or destroyed, it said."}, {"t": "p", "x": "Russia's heavy bombardment of the power grid ahead of winter has been an annual feature of the war, aimed at wearing down Ukraine's appetite for the fight by denying civilians heat and running water. Ukrainian officials have warned that Russia is stockpiling ballistic missiles for more attacks in the coming months."}, {"t": "p", "x": "Russian attacks killed three people in the Ukrainian city of Sloviansk, Vadym Liakh, head of the city military administration, said Saturday. Writing on social media, Liakh said that two apartment blocks were partially destroyed and other homes damaged."}, {"t": "p", "x": "A Russian strike also killed an ambulance driver in Ukraine's Kherson region, head of the local military administration Yaroslav Shanko said. The strike, which used guided bombs, wounded at least 33 others, he said."}, {"t": "h", "x": "Ukrainian drones kill 1, ground hundreds of flights at Moscow airports"}, {"t": "p", "x": "Elsewhere, a Russian woman was killed in a Ukrainian drone attack in the Russian border region of Belgorod, local officials said."}, {"t": "p", "x": "Russia's Ministry of Defense said Saturday that its forces had shot down 610 Ukrainian drones overnight over 15 Russian regions, as well as the annexed Ukrainian peninsula of Crimea and the Black Sea."}, {"t": "p", "x": "Moscow Mayor Sergei Sobyanin said that more than 100 drones were shot down en route to the Russian capital. More than 350 flights were canceled or delayed at Moscow's airports, local media reported, as planes were grounded in response to incoming drones."}]}, {"id": 1, "story": "sanctions", "country": "United Kingdom", "outlet": "The Guardian", "title": "Trump's pause on Russia sanctions is 'reward' for Putin, Zelenskyy says", "subtitle": "Ukrainian president warns it will embolden Russian leader and intensify war as Moscow hits country's power plants", "byline": "Andrew Roth in Kyiv", "date": "Sat 17 Oct 2026, 11.38 EDT", "link": "https://www.theguardian.com/world/2026/oct/17/volodymyr-zelenskyy-donald-trump-lift-sanctions-russia-intensify-war-ukraine", "words": 1093, "paras": [{"t": "p", "x": "Volodymyr Zelenskyy has described Donald Trump's decision to roll back sanctions on Russia as a \"reward\" for Vladimir Putin and warned it will embolden the Russian leader and intensify the Kremlin's war, as Moscow launched one of its worst strikes yet on Ukraine's power plants in an attempt to black out the country's cities before winter."}, {"t": "p", "x": "The Ukrainian president also said he expected the Trump administration to lift more sanctions against Russia in the future and called for Europe to establish its own negotiations with Moscow as the US has sought better ties and business deals with the Kremlin."}, {"t": "p", "x": "\"Unfortunately, the lifting of sanctions will continue, and I believe that the 'diesel deal' is the first step,\" said Zelenskyy on Saturday. \"Unfortunately, it seems to me that this cannot stop Putin; on the contrary, he feels joy and happiness that he has such support.\""}, {"t": "p", "x": "In a social media message, Zelenskyy wrote: \"A US ⁠sanctions blackout, easing pressure on the aggressor, financial rewards for Putin – all of this only encourages him to keep attacking. We must not give up ground."}, {"t": "p", "x": "\"We must keep trying to end the ‌war. To end it, not give Putin every reason to continue it indefinitely.\""}, {"t": "p", "x": "In the Trump administration's latest effort to reduce tensions with Russia, the US president announced on Friday that he would put a hold on a sweeping new sanctions package targeting the Russian economy, telling Congress the pause on the legislation passed by both chambers was in the national interest."}, {"t": "p", "x": "The act, named after the late senator Lindsey Graham, who championed the legislation, would have introduced tough new sanctions on Russia including a 100% tariff on major importers of Russian oil such as China and India, as well as sanctions on Russia's energy sector, financial institutions and shadow fleet of oil tankers."}, {"t": "p", "x": "On Saturday, Zelenskyy said the decision to waive the sanctions would encourage Vladimir Putin to intensify the war in Ukraine and called for support in the US to resurrect the bill."}, {"t": "p", "x": "\"At the time when the Russians launched such a massive strike against our energy sector, in America, regrettably, a decision was made to completely ignore the Lindsey Graham law, which was supposed to impose truly effective pressure on Russia to end this war,\" he wrote in a statement. \"This law could have – and still can! – help a great deal. But the law needs to actually work, and every voice in support of it matters.\""}, {"t": "p", "x": "US secretary of state Marco Rubio on Saturday said Trump's sanctions waiver would be a 60-day pause to \"analyse\" their impact on the global economy."}, {"t": "p", "x": "\"The president wants to take the 60-day period of time to sort of analyse what imposing both sanctions and tariffs will mean to the global economy and even to the US economy,\" Rubio said, noting that the economic restrictions involved a number of countries, not just Russia."}, {"t": "p", "x": "The move was greeted by the Russian presidential envoy, Kirill Dmitriev, who wrote on social media: \"The Trump administration's suspension of the Graham Act is an important and truly historic moment.\""}, {"t": "p", "x": "The legislation, which sanctions Russian officials, banks and a shadow fleet of tankers that keeps the country's energy supplies moving, was due to be implemented in two days."}, {"t": "p", "x": "It also directs Trump to impose up to 100% tariffs on the top five importers of Russian oil or natural gas, with an exception for countries that import less than 15% of Russia's natural gas exports and have taken significant steps to reduce those imports."}, {"t": "p", "x": "Zelenskyy also said the military-grade Starlink terminals used by Ukrainian forces still had limited functionality, and would disconnect from the network when travelling at more than 161km/h (100mph), interfering with drone operations."}, {"t": "p", "x": "The service was throttled inside Ukraine without warning on Tuesday, and Zelenskyy said his government had determined that the restrictions were a \"deliberate operation … to prevent us from defending ourselves\"."}, {"t": "p", "x": "By sending vehicles with the terminals into EU countries, the Ukrainians found they operated at speeds of more than 180km/h, in effect proving that the terminals were only experiencing restrictions in Ukraine."}, {"t": "p", "x": "\"The conclusion is clear: the restrictions are in effect within Ukraine but do not apply within the European Union,\" he said. \"In other words, this is a planned operation.\""}, {"t": "p", "x": "Trump's announcement that he would pause US sanctions came a week after he said Washington had agreed to purchase diesel from Russia to try to bring down global energy prices, upending years of US and western pressure on the Kremlin to end its war against Ukraine."}, {"t": "p", "x": "Trump said last week that Russia would immediately supply more than 300,000 tonnes of diesel, followed by an additional 500,000 tonnes in November and 1m tonnes \"immediately thereafter\". Russia would deliver an additional 3m tonnes \"within a short period of time\" after that, he wrote."}, {"t": "p", "x": "The Trump administration's decision to waive the sanctions is the latest consequence of a brutal quarrel between Trump and Zelenskyy. Several times this week, the US did not provide intelligence of impending ballistic missile attacks to Ukraine, in addition to the White House reportedly ordering the Pentagon to throttle the military-grade version of the Starlink satellite internet network used by Ukraine's armed forces."}, {"t": "p", "x": "\"We very much hope – and I personally hope – that the president of the United States of America will do everything so that Putin stops the killings, stops the strikes on our energy infrastructure, and stops this war,\" Zelenskyy said. \"But once again, you cannot achieve this by restricting Ukraine's responses to Russia for killing our people. And even less so by lifting sanctions.\""}, {"t": "p", "x": "Trump has demanded that Ukraine halt its strikes on Russian oil refineries, as he has blamed the war in Ukraine, rather than the closure of the strait of Hormuz, for the worldwide spike in diesel prices. Ukraine unilaterally halted the strikes after Trump declared an \"energy ceasefire\" last week, but resumed them when it became clear that Russia was stepping up its attacks on Ukrainian power plants and substations."}, {"t": "p", "x": "Zelenskyy said on Saturday that Russia had launched one of its worst strikes yet against the country's energy infrastructure, hitting more than 15 critical power generation and transmission facilities and causing \"severe consequences\"."}, {"t": "p", "x": "He also indicated that Ukraine's dwindling stock of anti-air weapons made it difficult to shoot down many of the loitering munitions, cruise missiles and ballistic missiles being launched each night at Ukraine."}, {"t": "p", "x": "\"Although our warriors are shooting down a significant number of them,\" he said, the \"sheer scale and unrelenting pace of Russia's strikes, specifically against our energy sector, are unfortunately having severe consequences.\""}]}, {"id": 2, "story": "sanctions", "country": "Canada", "outlet": "CBC News", "title": "Zelenskyy urges support for new U.S. sanctions on Russia hours after Trump paused them", "subtitle": "Ukraine's leader also said Moscow carried out massive strike on energy infrastructure", "byline": "The Associated Press", "date": "Posted: Oct 17, 2026, 5:27 AM PDT", "link": "https://www.cbc.ca/news/world/zelenskyy-trump-russia-sanctions-9.7385125?cmp=rss", "words": 369, "paras": [{"t": "p", "x": "Ukrainian President Volodymyr Zelenskyy urged supporters on Saturday to speak out in defence of new U.S. sanctions against Russia, hours after U.S. President Donald Trump signed an executive order pausing a sweeping package of restrictions targeting the Russian economy."}, {"t": "p", "x": "The White House's decision has further raised fears that Ukraine could be left exposed to Moscow's escalating assaults with winter approaching."}, {"t": "p", "x": "Zelenskyy described Trump's move to put sanctions on hold as unfortunate, but he did not directly criticize the U.S. leader. Tensions between Ukraine and Washington have deepened in recent days."}, {"t": "p", "x": "\"A decision was unfortunately made in America to completely disregard the Lindsey Graham Act, which was supposed to impose truly effective pressure on Russia to bring this war to an end,\" Zelenskyy wrote on social media platform X."}, {"t": "p", "x": "He also expressed hope that the new sanctions could be revived. \"This Act could have helped enormously — and still can! But it needs to actually work, and every voice in support of it matters,\" he said."}, {"t": "h", "x": "'Severe consequences' from strikes: Zelenskyy"}, {"t": "p", "x": "Zelenskyy also said on Saturday that Moscow had carried out a massive strike on Ukraine's energy infrastructure, targeting more than 15 sites across the country."}, {"t": "p", "x": "\"The sheer scale and unrelenting pace of Russia's strikes, specifically against our energy sector, are unfortunately having severe consequences,\" he said."}, {"t": "p", "x": "Ukraine's air force said that Russian forces launched four cruise missiles and 332 attack drones overnight. All of the missiles and 289 of the drones had been suppressed or destroyed, it said."}, {"t": "p", "x": "Russia's heavy bombardment of the power grid ahead of winter has been an annual feature of the nearly five-year-old war, aimed at wearing down Ukraine's appetite for the fight by denying civilians heat and running water. Ukrainian officials have warned that Russia is stockpiling ballistic missiles for more attacks in the coming months."}, {"t": "h", "x": "Russia claims it has taken control of another town"}, {"t": "p", "x": "The Russian Defence Ministry said on Saturday its forces had taken control of eight more Ukrainian settlements, including the town of Dobropillia in eastern Donetsk region, news agency Interfax reported."}, {"t": "p", "x": "The town, southwest of the key centres of Kramatorsk and Sloviansk, has been under sustained Russian attack for some time. But Ukraine's General Staff denied Russia's claim and said on Saturday that Ukrainian forces remained in control of the eastern town of Dobropillia."}]}, {"id": 3, "story": "france", "country": "United States", "outlet": "The New York Times", "title": "Unrest Mars Day of Protest in France, as Student Movement Turns National", "subtitle": "Riots broke out in several French cities alongside peaceful marches of tens of thousands of people demonstrating against rising living costs and poor school conditions.", "byline": "Catherine Porter, reporting from Paris", "date": "Oct. 17, 2026", "link": "https://www.nytimes.com/2026/10/17/world/europe/france-protest-riots-marseille.html", "words": 942, "paras": [{"t": "p", "x": "Unrest flared across France on Saturday amid demonstrations against rising living and fuel costs that built on weeks of high school protests, heightening a sense of fiscal and social crisis in the country."}, {"t": "p", "x": "More than half a million people joined 110 marches throughout the country, according to the interior ministry, making it the biggest day of protest since unrest began to surge nationally roughly a month ago. One of France's main unions, the C.G.T., estimated a higher number of 800,000 protesters."}, {"t": "p", "x": "The protests marked a convergence between a student-focused movement that has spurred demonstrations out of hundreds of schools, and a broader social movement that appeals to French citizens of different ages."}, {"t": "p", "x": "In many places, the protests were overtaken by violent confrontations between rioters and police officers, including in Marseille, France's second-largest city, where people briefly broke into the city hall and knocked over a bust of Marianne, a symbol of the French Republic, before the police cleared them out. By nightfall, roughly 400 people, most of them adults, had been arrested across the country, according to the interior minister, Laurent Nuñez."}, {"t": "p", "x": "A tourism office in Lyon was also broken into and set on fire by rioters, many of them dressed in black clothes, masks and goggles. In Paris, where more than 100,000 people marched peacefully in the streets, a few hundred rioters also faced off against riot police, mostly in the Place de la République, a central square, according to the police. Cars were burned and storefronts smashed, the police said."}, {"t": "p", "x": "President Emmanuel Macron said the culprits would be \"prosecuted and punished.\""}, {"t": "p", "x": "In a post on social media, he added: \"We will all stand united against the sowers of chaos, who seek only to bring down our institutions and prevent those who peacefully express their demands from doing so.\""}, {"t": "p", "x": "Since the student protests began last month, highlighting poor conditions in French schools, hundreds of people have been injured amid escalating clashes with riot police. Many of those injured have been young people, including a 15-year-old whose left hand was blown off by a stun grenade, and thousands have been arrested, most of them minors, law enforcement officials said."}, {"t": "p", "x": "On Saturday, that youth-led movement evolved into a wider display of anger at the government of President Emmanuel Macron, who leaves office next year after a decade in power that has come to be defined by political crisis and economic stagnation."}, {"t": "p", "x": "The protests came as the government tries to pass a belt-tightening budget and as France approaches presidential elections in 2027. The French government has acknowledged that some of the students' demands are legitimate but has condemned \"urban violence.\" It has also accused a leading far-left party, France Unbowed, of stoking the demonstrations, a contention that the party has rejected."}, {"t": "p", "x": "On Saturday, as images of rioters surging into buildings and setting cars on fire played on loop on French news channels, Prime Minister Sébastien Lecornu condemned the violence, saying on X that it was sparked by \"ultraleft groups\" who \"clearly want to use these acts of violence as a 'warm-up' before the presidential election.\""}, {"t": "p", "x": "He lauded the police, saying they had \"faced violence of extreme intensity to protect our fellow citizens.\" He added: \"We will not be intimidated. No one will impose their political agenda through violence.\""}, {"t": "p", "x": "The leader of France Unbowed, Jean-Luc Mélenchon, replied by posting photos of peaceful protests from around the country and blamed the government for giving orders to \"relentlessly\" direct tear gas at protesters in Paris. \"The confrontation seems to be the goal of this 'maintaining order' strategy,\" he wrote on social media."}, {"t": "p", "x": "The interior minister, Mr. Nuñez, said that by late afternoon the police were no longer confronting ultraleft groups. He said that they were instead facing off against \"opportunistic delinquents\" who were looting stores in many cities across the country."}, {"t": "p", "x": "In Paris, the looting and damage went on long after nightfall. Emmanuel Grégoire, the city's mayor, said the cost of the damage, once it was finally tabulated, would be \"immense\" as \"entire streets have been methodically ravaged\" along with public squares and many monuments."}, {"t": "p", "x": "Throughout the day, the rioters targeted many symbols of the state."}, {"t": "p", "x": "In Bordeaux, the official residence of the prefect — the region's top civil servant — was damaged. In Marseille, a municipal police station was damaged, along with the city hall. Rioters also set fire to the city hall in Limoges, a town in central France renowned for its porcelain, and attacked the city hall in the northern city of Lille, breaking its door and many windows."}, {"t": "p", "x": "\"These acts are particularly shocking,\" said Charlotte Brun, a vice-mayor of Lille, on French television. \"It's the common house of all the citizens. To attack public services while we are thousands in on the road, with message against the high cost of living — it conflicts with the main message of today.\""}, {"t": "p", "x": "Still, many marches across the country ended peacefully."}, {"t": "p", "x": "\"We sang, we saw people dance, funny signs, no rioters,\" said Solène Millon, 35, a photographer chatting with friends at the end of the march in Paris. \"The mood was great. What we see on TV, with people breaking things, is a minority.\""}, {"t": "p", "x": "Estelle Grandidier, a nonprofit worker who joined the march to protest degrading public services in France, agreed. She called the movement a \"convergence of struggles.\" And she, like many in the country, wondered what would come next."}, {"t": "p", "x": "\"There are no clear guidelines. Everyone comes with their own demands,\" said Ms. Grandidier, 41. \"So the question is, 'What is the next step?'\""}, {"t": "p", "x": "Ségolène Le Stradic contributed reporting."}, {"t": "p", "x": "Catherine Porter is an international reporter for The Times, covering France. She is based in Paris."}]}, {"id": 4, "story": "france", "country": "United Kingdom", "outlet": "The Guardian", "title": "Buildings set ablaze and more than 1,200 arrested as police clash with protesters across France", "subtitle": "Police fire teargas in Paris and Limoges town hall 'largely lost' to fire – with officials blaming violence on 'ultra-left'", "byline": "Kim Willsher in Paris and William Christou", "date": "Sat 17 Oct 2026, 20.01 EDT", "link": "https://www.theguardian.com/world/2026/oct/17/protests-france-high-prices-social-security-gilets-jaunes", "words": 1111, "paras": [{"t": "p", "x": "More than 1,200 people were arrested in France on Saturday after protesters supporting high school students clashed with police, with some demonstrations later spiralling out of control as buildings were set ablaze and shops looted."}, {"t": "p", "x": "Police fired teargas in confrontations with protesters, as demonstrations across France were boosted by other groups angry about high prices and the fraying of a social welfare system. While hundreds of thousands protested peacefully in street marches in scores of cities, violent fringe groups targeted public buildings, luxury boutiques and supermarkets and attacked police vehicles and officers."}, {"t": "p", "x": "Late on Saturday, prime minister Sébastien Lecornu said 1,200 people had been arrested and 150 police hurt."}, {"t": "p", "x": "Interior minister Laurent Nuñez said the official demonstration had been hijacked by casseurs – \"opportunistic delinquents who had seen a chance to pillage and loot … we will find them and deal with them firmly\"."}, {"t": "p", "x": "He said the state was not planning to declare a state of emergency but added: \"I very strongly condemn the violence we have seen.\""}, {"t": "p", "x": "In the city of Limoges, the town hall was \"largely lost\" to a fire set by masked protesters, the top regional official told the AFP news agency."}, {"t": "p", "x": "\"The roof has collapsed on to lower floors, except the west wing, and two-thirds of the exterior has already disappeared,\" local prefect Maurice Barate, said, adding that the extensive damage to the 143-year-old building was a \"catastrophe for heritage.\""}, {"t": "p", "x": "In Marseille, protesters stormed the town hall, ramming the door with security barriers they removed from the street. They briefly managed to enter the municipal building, where a protester spray-painted an \"A\" for anarchy on a wall before the police removed them."}, {"t": "p", "x": "Around Place de la République in central Paris, a peaceful march turned violent, with police firing teargas at black-clad and masked rioters who threw fireworks and paving stones, attacked a bank and looted a sports shop."}, {"t": "p", "x": "\"We're taking the Bastille!\" one demonstrator yelled."}, {"t": "p", "x": "Others set wheelie bins on fire and threw firecrackers inside or pushed over glass recycling bins and picked up the bottles inside to use as missiles. A lorry was set on fire and flames spread to a nearby building."}, {"t": "p", "x": "Along Boulevard Magenta, one of the main south-north axis north of Place de la République running through a mostly working-class area, dozens of shops were broken into and looted."}, {"t": "p", "x": "Groups tried to break into the Galeries Lafayette department store, smashed banks, ransacked a Lacoste store and other boutiques and looted a mobile phone shop."}, {"t": "p", "x": "Residents in surrounding streets were forced to close windows and doors as huge clouds of teargas rose to roof level."}, {"t": "p", "x": "Saturday's mobilisation followed calls on social media to revive the gilets jaunes (yellow vests) movement, which emerged in 2018 against social injustice."}, {"t": "p", "x": "The protests began last month at schools ⁠in the poor northern suburbs of Paris, where ⁠anger over teacher ​absences and shabby facilities quickly morphed into a nationwide movement against inequality, weak public spending and falling standards."}, {"t": "p", "x": "Saturday's protests called for teachers and students, labourers, pensioners and farmers to join the protests and widen the movement."}, {"t": "p", "x": "The CGT, one of France's biggest labour unions, has also backed the protests, calling for \"higher wages and pensions, lower prices and the protection of public services that meet people's needs\"."}, {"t": "p", "x": "About 45% of French people are worried about the rising cost of living and inflation, according to a 2,000-person survey conducted in October."}, {"t": "p", "x": "The violence began on the sidelines of marches in the capital and other cities which the interior ministry reported were attended by 550,000 people. The CGT union said 800,000 people participated."}, {"t": "p", "x": "Protesters ⁠in hi-vis vests blocked streets, an echo of the unrest that dogged President Emmanuel Macron's previous term, and in Marseille rubbish bins were set ​alight."}, {"t": "p", "x": "Both the far left and far right in France sought to capitalise on the protest movement, with the left positioning itself on the side of the protesters and the right backing the police."}, {"t": "p", "x": "Jean-Luc Mélenchon, the leader of the far-left France Unbowed party, marched in a demonstration on Tuesday and has expressed support for student protesters. He urged demonstrators to stay away from looting, describing it as \"contrary to our methods\"."}, {"t": "p", "x": "Far-right candidate Marine Le Pen condemned \"the rioters\" and claimed that the party of Melenchon, had \"legitimised the violence\"."}, {"t": "p", "x": "A large police presence was visible in central Paris, especially near landmarks such as ⁠the Avenue des Champs-Élysées and the Arc de Triomphe, which were excluded from the routes of the two official demonstrations."}, {"t": "p", "x": "Whole streets in Paris \"have been devastated\", the city's mayor, Emmanuel Gregoire, said."}, {"t": "p", "x": "\"We are fighting because the cost of living is ‌too harsh, because the price of ‌fuel is too high, because high school pupils are being violently attacked and hurt all over the country just for trying to ‌protest and ask for more teachers and decent learning conditions,\" said a 19-year-old protester in Paris who gave her name as Lola."}, {"t": "p", "x": "Macron is entering the final stretch of his presidency, leaving behind a polarised electorate and a badly fragmented political landscape."}, {"t": "p", "x": "On Friday, the president appealed for calm and respect for people and property as officials warned of possible violence."}, {"t": "p", "x": "\"There is a constitutional right to protest and to express oneself, and I have always been vigilant and attentive that that right is fully respected,\" he said. \"But this right comes with the need to respect. Respect for people, respect for property, and therefore a commitment not to insult or destroy.\""}, {"t": "p", "x": "Macron denounced as \"unacceptable\" the potential presence of people \"solely to cause damage and create unrest\"."}, {"t": "p", "x": "Nuñez said hundreds of protest actions and more than 80 marches were expected nationwide, including spontaneous gatherings, street demonstrations and blockades."}, {"t": "p", "x": "Police banned some other proposed gatherings in central Paris. Many Métro stations were closed on Saturday at the police's request, including those around the Champs-Élysées and near the presidential palace, parliament and government offices."}, {"t": "p", "x": "In recent weeks, there have been thousands of arrests, hundreds of injuries, and schools set on fire as the new school year descended into nationwide student protests that are influencing the country's presidential election campaign and drawing international attention."}, {"t": "p", "x": "The police watchdog is investigating at least two dozen allegations of police violence, while the French prime minister said that more than 900 police officers had been injured."}, {"t":  of French broadcasters CNews and Europe 1 in western Paris were broken by protesters, and AFP journalists saw several parked cars torched. Police in the capital fired a water cannon and tear gas when hundreds of protesters wearing face masks, some setting off fireworks, confronted them at several locations, AFP reporters saw."}, {"t": "p", "x": "Macron vowed on X that \"those who carried out vandalism, attacked administrative offices or businesses, or carried out looting – even in our town halls, will be prosecuted and punished.\""}, {"t": "h", "x": "Yellow Vest movement"}, {"t": "p", "x": "The country's Yellow Vest movement, which eight years ago staged street protests against Macron's government over planned fuel tax hikes, had called for the \"yellow and youth\" demonstrations. More than 600 demonstrations were planned across France, according to a website set up by organizers."}, {"t": "p", "x": "In Paris, authorities banned protests around government buildings, the Champs-Élysées shopping avenue and train stations. Many of the demonstrators complained about inflation sent soaring over 3% by the war in the Middle East. Others slammed perceived police brutality in student protests that have gripped France over the past four weeks. The combined unrest of both protest movements makes for a febrile climate as the country heads toward presidential elections in six months."}, {"t": "h", "x": "Le Pen blames 'rioters'"}, {"t": "p", "x": "Opposition politicians vying to succeed Macron have seized upon the protests. Far-right presidential candidate Marine Le Pen, who has sided with the police, said on X: \"Looting, pillaging, attacking police − rioters have once again sullied the October 17 demonstrations over the cost of living.\" She claimed that the protesters' demands had been \"hijacked by the far left.\""}, {"t": "p", "x": "Her far-left rival Jean-Luc Mélenchon insisted that \"everything is passing off peacefully\" in most of the nationwide demonstrations, while accusing television news of \"flooding us with images of violence in dozens of cities.\" Macron on Friday urged \"respect for people and property.\""}, {"t": "p", "x": "Several protesters sought to draw parallels with the French Revolution of 1789. \"It's the Revolution − we're taking the Bastille!\" some shouted in Marseille during the forced entry of the mayor's offices. In the western city of La Rochelle, marchers streamed behind a placard reading: \"Revolution or death.\" And in the southern city of Montpellier, a giant blue sign reading \"The people will win\" was unfurled above a central square."}, {"t": "p", "x": "\"The government is trembling, and it's right to tremble because when the French people are angry, they never let up,\" Ryad Rani, the head of the LSU high school student representative body, told journalists in Paris."}, {"t": "p", "x": "Le Monde with AFP"}, {"t": "p", "x": "Agencies contributed reporting."}]}];
